<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>

  <!-- Glowing background ambient spots -->
  <circle cx="200" cy="150" r="180" fill="#06b6d4" opacity="0.06" filter="url(#glowCyan)"/>
  <circle cx="950" cy="300" r="220" fill="#10b981" opacity="0.05" filter="url(#glowCyan)"/>

  <!-- Top Cyber Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyanGrad)"/>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 45)">
    <rect width="260" height="32" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="18" cy="16" r="5" fill="#10b981"/>
    <text x="32" y="21" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">UN FANTASMA EN EL SISTEMA</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 125)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      CyberFirewall <tspan fill="url(#cyanGrad)">LAB</tspan>
    </text>
    <text x="0" y="32" font-family="'JetBrains Mono', monospace, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Simulador Interactivo de Firewalls Perimetrales &amp; Host (Linux &amp; Windows)
    </text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(60, 195)">
    <!-- Badge 1: iptables/nftables -->
    <rect x="0" y="0" width="165" height="28" rx="6" fill="#131e36" stroke="#1e293b"/>
    <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#06b6d4">🐧 iptables / nftables</text>

    <!-- Badge 2: Windows Defender -->
    <rect x="175" y="0" width="175" height="28" rx="6" fill="#131e36" stroke="#1e293b"/>
    <text x="187" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">🪟 Windows Defender</text>

    <!-- Badge 3: Packet Tracer -->
    <rect x="360" y="0" width="145" height="28" rx="6" fill="#131e36" stroke="#1e293b"/>
    <text x="372" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10b981">⚡ Packet Tracer</text>

    <!-- Badge 4: Nmap Scanner -->
    <rect x="515" y="0" width="135" height="28" rx="6" fill="#131e36" stroke="#1e293b"/>
    <text x="527" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#f59e0b">🎯 Nmap Scanner</text>

    <!-- Badge 5: CIS Audit -->
    <rect x="660" y="0" width="130" height="28" rx="6" fill="#131e36" stroke="#1e293b"/>
    <text x="672" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#a855f7">🛡️ CIS Audit</text>
  </g>

  <!-- Mockup Panel: Rule Matrix & Netfilter Pipeline -->
  <g transform="translate(60, 245)">
    <!-- Main Terminal Container -->
    <rect width="1080" height="215" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <rect width="1080" height="34" rx="12" fill="#0f172a"/>
    <circle cx="20" cy="17" r="4.5" fill="#f43f5e"/>
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="4.5" fill="#10b981"/>
    <text x="75" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">cyberfirewall-soc-lab — rules.matrix &amp; packet-tracer</text>

    <!-- Top Pipeline Row -->
    <g transform="translate(20, 50)">
      <rect width="1040" height="32" rx="6" fill="#070b14" stroke="#1e293b"/>
      <text x="15" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">HOOK PIPELINE:</text>
      <rect x="120" y="6" width="115" height="20" rx="4" fill="#082f49" stroke="#0284c7"/>
      <text x="130" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">PREROUTING</text>
      <text x="245" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">➔</text>
      <rect x="265" y="6" width="140" height="20" rx="4" fill="#064e3b" stroke="#059669"/>
      <text x="275" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#34d399">FORWARD (ROUTED)</text>
      <text x="415" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">➔</text>
      <rect x="435" y="6" width="125" height="20" rx="4" fill="#082f49" stroke="#0284c7"/>
      <text x="445" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">POSTROUTING</text>

      <rect x="850" y="6" width="175" height="20" rx="4" fill="#1e1b4b" stroke="#4f46e5"/>
      <text x="862" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#a5b4fc">CONNTRACK: ESTABLISHED</text>
    </g>

    <!-- Rule Rows Preview -->
    <g transform="translate(20, 95)" font-family="'JetBrains Mono', monospace" font-size="11">
      <!-- Rule 1: ACCEPT -->
      <rect x="0" y="0" width="1040" height="28" rx="4" fill="#0a1526" stroke="#0e2444"/>
      <text x="15" y="18" fill="#64748b">#1</text>
      <text x="50" y="18" fill="#e2e8f0" font-weight="600">Permitir Conexiones Establecidas (Stateful)</text>
      <text x="420" y="18" fill="#38bdf8">INPUT</text>
      <text x="510" y="18" fill="#94a3b8">ANY ➔ ANY</text>
      <text x="690" y="18" fill="#fbbf24">ESTABLISHED</text>
      <rect x="810" y="5" width="65" height="18" rx="3" fill="#064e3b" stroke="#10b981"/>
      <text x="822" y="18" font-size="10" font-weight="700" fill="#34d399">ACCEPT</text>
      <text x="910" y="18" fill="#64748b">142 pkts (85.2 KB)</text>

      <!-- Rule 2: DROP -->
      <rect x="0" y="34" width="1040" height="28" rx="4" fill="#160d16" stroke="#331422"/>
      <text x="15" y="52" fill="#64748b">#2</text>
      <text x="50" y="52" fill="#e2e8f0" font-weight="600">SSH desde Internet: descartar</text>
      <text x="420" y="52" fill="#f43f5e">INPUT -i eth0</text>
      <text x="510" y="52" fill="#94a3b8">ANY ➔ :22 (SSH)</text>
      <text x="690" y="52" fill="#fbbf24">NEW</text>
      <rect x="810" y="39" width="65" height="18" rx="3" fill="#4c0519" stroke="#f43f5e"/>
      <text x="828" y="52" font-size="10" font-weight="700" fill="#fb7185">DROP</text>
      <text x="910" y="52" fill="#64748b">19 pkts (1.1 KB)</text>

      <!-- Rule 3: ACCEPT Web -->
      <rect x="0" y="68" width="1040" height="28" rx="4" fill="#0a1526" stroke="#0e2444"/>
      <text x="15" y="86" fill="#64748b">#3</text>
      <text x="50" y="86" fill="#e2e8f0" font-weight="600">Permitir Servidor Web DMZ (HTTP/HTTPS)</text>
      <text x="420" y="86" fill="#38bdf8">FORWARD -i eth1</text>
      <text x="510" y="86" fill="#94a3b8">LAN ➔ 172.16.0.10:80,443</text>
      <text x="690" y="86" fill="#fbbf24">NEW</text>
      <rect x="810" y="73" width="65" height="18" rx="3" fill="#064e3b" stroke="#10b981"/>
      <text x="822" y="86" font-size="10" font-weight="700" fill="#34d399">ACCEPT</text>
      <text x="910" y="86" fill="#64748b">64 pkts (3.8 KB)</text>
    </g>
  </g>
</svg>
