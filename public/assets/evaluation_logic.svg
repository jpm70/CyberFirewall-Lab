<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" rx="12" fill="url(#compBg)" stroke="#1e293b"/>

  <text x="30" y="36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">COMPARATIVA DE MOTORES: LINUX VS WINDOWS DEFENDER</text>

  <!-- Left: Linux First Match -->
  <g transform="translate(30, 60)">
    <rect width="400" height="230" rx="8" fill="#070b14" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="400" height="32" rx="8" fill="#082f49"/>
    <text x="15" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">LINUX: iptables / nftables</text>
    <text x="260" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#bae6fd">First-Match Wins</text>

    <g transform="translate(15, 45)" font-family="'JetBrains Mono', monospace" font-size="10">
      <rect x="0" y="0" width="370" height="30" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="19" fill="#94a3b8">Regla 1: ¿Coincide?</text>
      <text x="240" y="19" fill="#f43f5e" font-weight="600">NO ➔ Siguiente fila</text>

      <rect x="0" y="38" width="370" height="30" rx="4" fill="#064e3b" stroke="#10b981"/>
      <text x="10" y="57" fill="#ffffff" font-weight="700">Regla 2: ¿Coincide?</text>
      <text x="210" y="57" fill="#34d399" font-weight="800">MATCH! ➔ EJECUTA ACCION</text>

      <rect x="0" y="76" width="370" height="30" rx="4" fill="#1e293b" opacity="0.3"/>
      <text x="10" y="95" fill="#64748b">Regla 3: (Ignorada por completo)</text>
      <text x="260" y="95" fill="#64748b">FLUJO DETENIDO</text>

      <rect x="0" y="114" width="370" height="30" rx="4" fill="#1e293b" opacity="0.3"/>
      <text x="10" y="133" fill="#64748b">Regla 4: (Ignorada)</text>
      <text x="260" y="133" fill="#64748b">FLUJO DETENIDO</text>

      <rect x="0" y="152" width="370" height="22" rx="4" fill="#082f49"/>
      <text x="10" y="167" fill="#38bdf8" font-size="9">¡El orden de las filas es CRÍTICO!</text>
    </g>
  </g>

  <!-- Right: Windows Precedence -->
  <g transform="translate(470, 60)">
    <rect width="400" height="230" rx="8" fill="#070b14" stroke="#4f46e5" stroke-width="1.2"/>
    <rect width="400" height="32" rx="8" fill="#1e1b4b"/>
    <text x="15" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a5b4fc">WINDOWS DEFENDER FIREWALL</text>
    <text x="270" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c7d2fe">Precedencia</text>

    <g transform="translate(15, 45)" font-family="'JetBrains Mono', monospace" font-size="10">
      <rect x="0" y="0" width="370" height="26" rx="4" fill="#31101b" stroke="#f43f5e"/>
      <text x="10" y="17" fill="#fda4af" font-weight="700">1. Reglas de Bloqueo Explicito (BLOCK)</text>
      <text x="310" y="17" fill="#f43f5e" font-weight="800">PRIORIDAD</text>

      <rect x="0" y="32" width="370" height="26" rx="4" fill="#064e3b" stroke="#10b981"/>
      <text x="10" y="49" fill="#a7f3d0" font-weight="700">2. Reglas de Permiso Explicito (ALLOW)</text>
      <text x="310" y="49" fill="#10b981" font-weight="800">SECUNDARIA</text>

      <rect x="0" y="64" width="370" height="26" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="81" fill="#94a3b8">3. Accion por Defecto del Perfil Activo</text>
      <text x="310" y="81" fill="#64748b">FALLBACK</text>

      <rect x="0" y="98" width="370" height="40" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="10" y="113" fill="#e0e7ff" font-weight="600">Perfiles de Red:</text>
      <text x="10" y="128" fill="#a5b4fc" font-size="9">• Dominio  • Privado  • Publico (Aislamiento)</text>

      <rect x="0" y="146" width="370" height="28" rx="4" fill="#4c0519"/>
      <text x="10" y="163" fill="#fecdd3" font-size="9" font-weight="700">Regla de oro: Explicit Block overrides Allow</text>
    </g>
  </g>
</svg>
